<!DOCTYPE html>
<html lang="pl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <style>
    /* Wymuszenie warstwy kompozytora / natychmiastowego renderu (np. Safari) */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body { -webkit-font-smoothing: antialiased; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="bcagencja">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>bcagencja</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API – wymagane dla map na web. Ustaw ten sam klucz co w AppConfig.googleMapsApiKey -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY" async defer></script>

  <style>
    #flutter-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(165deg, #1a1f28 0%, #14181f 50%, #0f1218 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s ease;
      overflow: hidden;
      /* Wymuszenie warstwy GPU / natychmiastowego renderu */
      transform: translateZ(0);
      will-change: opacity;
      contain: layout style paint;
    }
    #flutter-loading::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% 40%, rgba(190, 110, 89, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }
    #flutter-loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .loader-brand {
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      margin-bottom: 2.5rem;
      color: #fff;
      animation: loader-fade-in 0.6s ease-out;
    }
    .loader-brand span {
      color: #BE6E59;
      font-weight: 600;
    }
    .loader-spinner-wrap {
      position: relative;
      width: 64px;
      height: 64px;
      margin-bottom: 1.75rem;
    }
    .loader-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #BE6E59;
      border-right-color: rgba(190, 110, 89, 0.4);
      animation: loader-spin 1s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
    }
    .loader-ring-inner {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: #BE6E59;
      border-left-color: rgba(190, 110, 89, 0.3);
      animation: loader-spin 1.2s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite reverse;
    }
    .loader-dots {
      display: flex;
      gap: 10px;
      margin-bottom: 0.5rem;
    }
    .loader-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #BE6E59;
      box-shadow: 0 0 12px rgba(190, 110, 89, 0.5);
      animation: loader-bounce 1.2s ease-in-out infinite both;
    }
    .loader-dots span:nth-child(1) { animation-delay: 0s; }
    .loader-dots span:nth-child(2) { animation-delay: 0.15s; }
    .loader-dots span:nth-child(3) { animation-delay: 0.3s; }
    .loader-label {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      animation: loader-fade-in 0.6s ease-out 0.2s both;
    }
    .loader-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }
    .loader-bar::after {
      content: '';
      position: absolute;
      left: -40%;
      top: 0;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #BE6E59, transparent);
      animation: loader-shimmer 2s ease-in-out infinite;
    }
    @keyframes loader-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes loader-bounce {
      0%, 60%, 100% { transform: scale(0.75); opacity: 0.6; }
      30% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes loader-fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes loader-shimmer {
      0% { left: -40%; }
      100% { left: 140%; }
    }
  </style>

  <!--
    Safari: jeśli aplikacja się nie ładuje, włącz w Safari:
    Develop > Experimental Features > Allow WebGL in Web Workers
    (WEBGL_polygon_mode i WebGL w workerach mogą powodować błędy na Safari)
  -->
  <!-- Polyfill dla crypto.randomUUID (brak w starszych przeglądarkach / niektórych kontekstach) -->
  <script>
    (function() {
      if (typeof crypto !== 'undefined' && !crypto.randomUUID) {
        crypto.randomUUID = function() {
          return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
          });
        };
      }
    })();
  </script>
</head>
<body>
  <div id="flutter-loading">
    <div class="loader-content">
      <div class="loader-brand">BC <span>A</span>gencja</div>
      <div class="loader-spinner-wrap">
        <div class="loader-ring"></div>
        <div class="loader-ring-inner"></div>
      </div>
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
      <div class="loader-label">Ładowanie</div>
    </div>
    <div class="loader-bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('flutter-loading');
      if (el) el.classList.add('hidden');
    });
    setTimeout(function() {
      var el = document.getElementById('flutter-loading');
      if (el && !el.classList.contains('hidden')) el.classList.add('hidden');
    }, 15000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
